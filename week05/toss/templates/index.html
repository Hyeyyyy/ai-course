<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>토스페이먼츠 주문서형 결제 테스트</title>
    <script src="https://js.tosspayments.com/v2/standard"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        #payment-method, #agreement { margin-bottom: 20px; border: 1px solid #eee; padding: 10px; }
        button { width: 100%; padding: 15px; background-color: #3182f6; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:disabled { background-color: #ccc; }
        h1 { font-size: 24px; }
    </style>
</head>
<body>
    <h1>토스페이먼츠 결제 테스트</h1>
    
    <div id="payment-method"></div>
    <div id="agreement"></div>
    
    <button id="payment-button" disabled>결제하기</button>

    <script>
        const clientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
        const customerKey = TossPayments.ANONYMOUS;

        const tossPayments = TossPayments(clientKey);
        const widgets = tossPayments.widgets({ customerKey });

        widgets.setAmount({
            currency: "KRW",
            value: 1000
        });

        widgets.renderPaymentMethods({
            selector: "#payment-method",
            variantKey: "DEFAULT"
        });

        widgets.renderAgreement({
            selector: "#agreement",
            variantKey: "AGREEMENT"
        }).then(agreementWidget => {
            agreementWidget.on('agreementStatusChange', agreementStatus => {
                if (agreementStatus.agreedRequiredTerms) {
                    document.getElementById("payment-button").disabled = false;
                } else {
                    document.getElementById("payment-button").disabled = true;
                }
            });
        });

        document.getElementById("payment-button").addEventListener("click", async () => {
            try {
                await widgets.requestPayment({
                    orderId: Math.random().toString(36).substring(2, 11),
                    orderName: "테스트 상품",
                    successUrl: window.location.origin + "/success",
                    failUrl: window.location.origin + "/fail",
                });
            } catch (error) {
                console.error(error);
            }
        });
    </script>
</body>
</html>
