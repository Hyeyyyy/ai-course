<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        /* Reset and Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f7fa; /* Light background to contrast with the white card */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Mobile Container Simulation */
        .mobile-container {
            width: 100%;
            max-width: 390px; /* Match Figma width */
            height: 844px;    /* Match Figma height */
            background-color: #ffffff;
            border: 1px solid #d1d5db; /* Subtle border around the device frame if needed, but here we focus on the UI */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            border-radius: 20px; /* To look like a phone screen */
        }

        /* Content Wrapper */
        .content {
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
        }

        /* Typography */
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 16px;
            color: #6b7280;
            margin-bottom: 40px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        /* Input Styles */
        .input-group {
            margin-bottom: 24px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            background-color: #f9fafb;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #2e66ff;
            box-shadow: 0 0 0 3px rgba(46, 102, 255, 0.1);
            background-color: #fff;
        }

        input::placeholder {
            color: #9ca3af;
        }

        /* Button Style */
        .login-button {
            width: 100%;
            padding: 16px;
            background-color: #2e66ff;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 30px;
            transition: background-color 0.2s;
        }

        .login-button:hover {
            background-color: #1e4edb;
        }

        .login-button:active {
            transform: scale(0.98);
        }

        /* Footer Link */
        .footer {
            text-align: center;
            font-size: 14px;
            color: #6b7280;
        }

        .signup-link {
            color: #2e66ff;
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
        }

        .signup-link:hover {
            text-decoration: underline;
        }

        /* Responsive adjustment for small desktop screens */
        @media (max-height: 850px) {
            .mobile-container {
                height: auto;
                min-height: 844px;
            }
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <div class="content">
            <h1>다시 만나서 반갑습니다</h1>
            <p class="subtitle">학교 이메일로 로그인하세요</p>

            <div class="input-group">
                <label for="email">이메일</label>
                <input type="email" id="email" placeholder="아이디@daelim.ac.kr">
            </div>

            <div class="input-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="8자 이상">
            </div>

            <button class="login-button">로그인</button>

            <div class="footer">
                계정이 없으신가요? <a href="#" class="signup-link">회원가입</a>
            </div>
        </div>
    </div>

</body>
</html>
