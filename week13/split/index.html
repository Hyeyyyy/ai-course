<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나눠 내기 계산기</title>
    <style>
        :root { --primary: #4a90e2; --bg: #f0f2f5; --card: #fff; --text: #333; --error: #e74c3c; }
        body { font-family: sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 400px; }
        h1 { text-align: center; color: var(--primary); font-size: 1.4rem; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 1rem; }
        .result-card { background: var(--primary); color: white; text-align: center; padding: 20px; border-radius: 12px; }
        .res-val { font-size: 1.8rem; font-weight: bold; margin-top: 5px; }
        .btn-upload { display: block; width: 100%; background: var(--primary); color: white; text-align: center; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #file-input { display: none; }
        .status { margin-top: 10px; font-size: 0.85rem; text-align: center; min-height: 1.2em; }
        .error { color: var(--error); }
        .loading { color: var(--primary); }
        .item-list { margin-top: 15px; font-size: 0.9rem; }
        .item-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
<div class="container">
    <h1>💸 나눠 내기</h1>
    <div class="card">
        <div class="input-group"><label>총 금액 (원)</label><input type="number" id="total-amount" placeholder="0" oninput="calculate()"></div>
        <div class="input-group"><label>인원수 (명)</label><input type="number" id="people-count" value="1" min="1" oninput="calculate()"></div>
    </div>
    <div class="result-card"><div>1인당 금액</div><div class="res-val" id="per-person-amount">0원</div></div>
    <div class="card">
        <label for="file-input" class="btn-upload">📷 영수증 스캔</label>
        <input type="file" id="file-input" accept="image/*" onchange="handleImageUpload(event)">
        <div id="status-msg" class="status"></div>
        <div id="ai-items" class="item-list"></div>
    </div>
</div>
<script>
    async function ask(prompt, imageUrl) {
      const content = [{ type: "text", text: prompt }];
      if (imageUrl) content.push({ type: "image_url", image_url: { url: imageUrl } });
      const r = await fetch("https://krchoi.com/gemma4/v1/chat/completions", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "gemma4", messages: [{ role: "user", content: content }] })
      });
      const data = await r.json();
      return data.choices[0].message.content;
    }
    function parseJson(text) {
      const m = text.match(/```(?:json)?\s*([\s\S]*?)```/);
      try { return JSON.parse(m ? m[1] : text); } catch (e) { return null; }
    }
    function shrinkImage(file, maxSize = 1280) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.85));
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(file);
      });
    }
    function calculate() {
        const total = parseFloat(document.getElementById('total-amount').value) || 0;
        const people = parseInt(document.getElementById('people-count').value) || 1;
        const perPerson = Math.floor(total / people);
        document.getElementById('per-person-amount').innerText = perPerson.toLocaleString() + '원';
    }
    async function handleImageUpload(event) {
        const file = event.target.files[0];
        if (!file) return;
        const sm = document.getElementById('status-msg'), ad = document.getElementById('ai-items'), ti = document.getElementById('total-amount');
        sm.innerText = "읽는 중..."; sm.className = "status loading"; ad.innerHTML = "";
        try {
            const ri = await shrinkImage(file);
            const res = await ask("영수증 항목/금액 JSON 추출: [{'item': 'name', 'price': 100}]", ri);
            const items = parseJson(res);
            if (items && Array.isArray(items)) {
                let s = 0; ad.innerHTML = "<strong>항목:</strong>";
                items.forEach(it => {
                    const r = document.createElement('div'); r.className = 'item-row';
                    r.innerHTML = `<span>${it.item}</span><span>${it.price.toLocaleString()}원</span>`;
                    ad.appendChild(r); s += it.price;
                });
                ti.value = s; calculate(); sm.innerText = "";
            } else throw new Error();
        } catch (e) { sm.innerText = "읽지 못했습니다"; sm.className = "status error"; }
    }
</script>
</body>
</html>
