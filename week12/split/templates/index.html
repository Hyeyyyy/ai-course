<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>나눠 내기 계산기</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 400px;
        }
        h1 {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #1a73e8;
        }
        .input-group {
            margin-bottom: 1.2rem;
        }
        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #1a73e8;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        button:active {
            background-color: #1557b0;
        }
        .result-area {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 10px;
            text-align: center;
        }
        .result-success {
            background-color: #e8f0fe;
            color: #1967d2;
        }
        .result-error {
            background-color: #fce8e6;
            color: #d93025;
        }
        .result-val {
            font-size: 1.8rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>💸 나눠 내기</h1>
        <form method="POST">
            <div class="input-group">
                <label for="amount">총 금액 (원)</label>
                <input type="number" id="amount" name="amount" placeholder="예: 50000" value="{{ amount if amount != '' else '' }}" required inputmode="numeric">
            </div>
            <div class="input-group">
                <label for="people">인원 수 (명)</label>
                <input type="number" id="people" name="people" placeholder="예: 4" value="{{ people if people != '' else '' }}" required inputmode="numeric">
            </div>
            <button type="submit">계산하기</button>
        </form>

        {% if error %}
        <div class="result-area result-error">
            {{ error }}
        </div>
        {% endif %}

        {% if result is not none %}
        <div class="result-area result-success">
            <div>1인당 금액</div>
            <div class="result-val">{{ "{:,.0f}".format(result) }}원</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
